[package]
name = "artmark"
version = "0.1.1"
edition = "2024"
description = "Local artifact catalog and FTS5 search for AI agents"
license = "Apache-2.0"
repository = "https://github.com/sboorlagadda/artmark"
readme = "README.md"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
uuid = { version = "1", features = ["v7"] }
