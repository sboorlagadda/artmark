name: Feature request
description: Suggest an improvement to the local artifact registry
title: "feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the artifact workflow that is difficult today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe what you would expect artmark to do.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Share examples without credentials or private source content.
