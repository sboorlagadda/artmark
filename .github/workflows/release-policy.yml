name: Release policy

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: release-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  version:
    name: Release label and version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check one SemVer bump, label, and lockfile
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels) }}
        run: python scripts/version_policy.py check-pr --base-sha "$BASE_SHA"
